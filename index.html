<style>
.p320-btn{margin:10px 0 18px}
.p320-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}

<script>
(function(){
  const APP320=document.getElementById("app");

  function safe320(k){
    try{const x=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(x)?x:[]}
    catch(e){return[]}
  }
  function day320(v){
    const d=new Date(v); if(isNaN(d)) return "日時なし";
    return d.toLocaleDateString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric"});
  }
  function unit320(r){return r.unit||r.nodeTitle||r.title||"単元名の記録なし"}
  function sub320(r){
    let s=r.subject||"学習";
    if(s==="外国語活動" && Number(r.grade)>=5) s="外国語";
    return s;
  }
  function rows320(){
    let a=(typeof records!=="undefined" && Array.isArray(records))
      ? records.filter(r=>!r.studentId||r.studentId===profile.id).slice()
      : [];
    const rd=safe320("ponoJapaneseReading313").filter(r=>!r.studentId||r.studentId===profile.id);
    rd.forEach(x=>{
      const dup=a.some(r=>r.date===x.date && unit320(r)===x.unit);
      if(!dup)a.push({studentId:x.studentId||profile.id,date:x.date,subject:"国語",grade:x.grade,unit:x.unit,total:x.total||10,correct:x.total||10,hints:x.hints||0,seconds:x.seconds||0,status:"10問完了"});
    });
    return a.sort((x,y)=>new Date(x.date)-new Date(y.date));
  }
  function state320(r){
    const s=String(r.status||"");
    if(s.includes("自力")||s.includes("定着")||s.includes("10問完了")||r.result==="ok"||r.ok===true)return "確認";
    if(s.includes("練習")||Number(r.hints)>0||(r.rate!=null&&Number(r.rate)<80))return "練習";
    return "取組";
  }
  function dashboard320(){
    const rr=rows320();
    head("📊 学習の進み具合",home);
    A.append(e("div","card",`<h2>${profile.name}の学習記録</h2><p>在籍 小学${profile.grade}年</p><p class="tiny">点数だけでなく、取り組んだ単元・練習中・確認できた内容を分けて見ます。</p>`));
    if(!rr.length){
      A.append(e("div","card","<h2>🌱 これから記録がたまります</h2><p>学習を終えると、ここに教科・単元・日付が増えていきます。</p>"));
      return;
    }
    const mp=new Map(); rr.forEach(r=>mp.set(sub320(r)+"|"+unit320(r),r));
    const uu=[...mp.values()];
    const days=new Set(rr.map(r=>day320(r.date))).size;
    const mins=Math.round(rr.reduce((a,r)=>a+(Number(r.seconds)||0),0)/60);
    A.append(e("div","card",`<h2>全体</h2><div class="p320-stats"><div><b>${days}</b><span>学習日</span></div><div><b>${rr.length}</b><span>学習記録</span></div><div><b>${uu.length}</b><span>取り組んだ単元</span></div></div>${mins?`<p class="tiny">記録されている学習時間：約${mins}分</p>`:""}`));

    ["国語","算数","理科","社会","外国語活動","外国語"].forEach(s=>{
      const u=uu.filter(r=>sub320(r)===s); if(!u.length)return;
      let ok=u.filter(r=>state320(r)==="確認").length;
      let practice=u.filter(r=>state320(r)==="練習").length;
      let latest=u.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      A.append(e("div","card",`<h2>${s}</h2><p><b>${u.length}単元</b>に取り組み記録があります。</p><div class="p320-track"><span style="width:${Math.max(8,ok/Math.max(1,u.length)*100)}%"></span></div><p><span class="pill">✅ 確認 ${ok}</span><span class="pill">🌱 練習中 ${practice}</span></p><p class="tiny">最近：${day320(latest.date)}　${unit320(latest)}</p>`));
    });

    const retry=uu.filter(r=>state320(r)==="練習").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
    A.append(e("div","card",`<h2>🌱 もう一度確認するとよさそうな単元</h2>${retry.length?retry.map(r=>`<p><b>${sub320(r)}｜${unit320(r)}</b><br><span class="tiny">${day320(r.date)}</span></p>`).join(""):"<p>現在の記録では、練習中と表示される単元はありません。</p>"}`));

    const recent=rr.slice().reverse().slice(0,8);
    A.append(e("div","card",`<h2>🗓️ 最近の学習</h2>${recent.map(r=>`<p><b>${day320(r.date)}　${sub320(r)}｜${unit320(r)}</b><br><span class="tiny">${r.status||state320(r)}</span></p>`).join("")}</div>`));
    A.append(e("p","tiny","※試作版は、この端末のブラウザ内に保存された記録を表示しています。"));
  }

  function inject320(){
    if(!APP320)return;
    const title=(APP320.querySelector("h1")?.textContent||"").trim();
    if(title.includes("自分の子の学び") && !APP320.querySelector(".p320-parent")){
      const b=btn("📊 学習の進み具合を見る",dashboard320,"primary");
      b.classList.add("p320-parent","p320-btn");
      const firstCard=APP320.querySelector(".card");
      if(firstCard) APP320.insertBefore(b,firstCard);
      else APP320.append(b);
    }
    if(title.includes("先生・Pono") && !APP320.querySelector(".p320-teacher")){
      const b=btn("📊 生徒の学習記録・進み具合",dashboard320,"primary");
      b.classList.add("p320-teacher","p320-btn");
      const first=APP320.querySelector("button:not(.back)");
      if(first) APP320.insertBefore(b,first);
      else APP320.append(b);
    }
  }

  new MutationObserver(inject320).observe(APP320,{childList:true,subtree:true});
  inject320();
  document.addEventListener("click",()=>setTimeout(inject320,0),true);
})();
</script>

<script>
(function(){
  function safe321(k){
    try{const x=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(x)?x:[]}
    catch(e){return[]}
  }
  function jpDay321(v){
    const d=new Date(v); if(isNaN(d))return "日時なし";
    return d.toLocaleDateString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric"});
  }
  function dayKey321(v){
    const d=new Date(v); if(isNaN(d))return "unknown";
    return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  }
  function subject321(r){
    let s=r.subject||"学習";
    if(s==="外国語活動" && Number(r.grade)>=5)s="外国語";
    return s;
  }
  function unit321(r){
    const vals=[r.unit,r.nodeTitle,r.title];
    for(const v of vals){if(v && String(v).trim())return String(v).trim()}
    if(Array.isArray(r.adaptivePath) && r.adaptivePath.length){
      const x=[...r.adaptivePath].reverse().find(a=>a&&a.title);
      if(x&&x.title)return String(x.title).trim();
    }
    if(r.content){
      const c=String(r.content).trim();
      if(c && !/^.+の問題\s*\d+問$/.test(c) && c.length<=36)return c;
    }
    return subject321(r)==="算数" ? "基礎確認" : "学習内容の確認";
  }
  function state321(r){
    const s=String(r.status||"");
    if(s.includes("自力")||s.includes("定着")||s.includes("10問完了")||s.includes("学習済み")||r.result==="ok"||r.ok===true)return "確認";
    if(s.includes("練習")||s.includes("基礎を確認")||Number(r.hints)>0||(r.rate!=null&&Number(r.rate)<80))return "練習";
    return "取組";
  }

  function allRaw321(){
    let a=safe321("ponoV9Records").filter(r=>!r.studentId||r.studentId===profile.id);
    const rd=safe321("ponoJapaneseReading313").filter(r=>!r.studentId||r.studentId===profile.id);
    rd.forEach(x=>{
      const dup=a.some(r=>r.date===x.date && subject321(r)==="国語" && unit321(r)===x.unit);
      if(!dup)a.push({
        studentId:x.studentId||profile.id,date:x.date,subject:"国語",grade:x.grade,
        unit:x.unit,total:x.total||10,correct:x.total||10,hints:x.hints||0,
        seconds:x.seconds||0,status:"10問完了",source:"reading313"
      });
    });
    return a.sort((x,y)=>new Date(x.date)-new Date(y.date));
  }

  /* 同じ日に同じ単元・同じ結果で重なった完了記録は、表示上1つにまとめる。
     元データは消さない。複数回取り組んだことは回数として残す。 */
  function grouped321(rows){
    const map=new Map();
    rows.forEach(r=>{
      const key=[
        dayKey321(r.date),subject321(r),unit321(r),state321(r),
        r.correct??"",r.total??"",r.rate??""
      ].join("|");
      if(!map.has(key)){
        map.set(key,{...r,_count:1});
      }else{
        const g=map.get(key); g._count++;
        g.seconds=Math.max(Number(g.seconds)||0,Number(r.seconds)||0);
        g.hints=Math.max(Number(g.hints)||0,Number(r.hints)||0);
        if(new Date(r.date)>new Date(g.date))g.date=r.date;
      }
    });
    return [...map.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));
  }

  function dashboard321(){
    const raw=allRaw321();
    const rr=grouped321(raw);

    head("📊 学習の進み具合", parent);
    A.append(e("div","card",`<h2>${profile.name}の学習記録</h2>
      <p>在籍 小学${profile.grade}年</p>
      <p class="tiny">同じ日に同じ単元・同じ結果で重なった記録は、見やすいよう1つにまとめて表示します。元の学習記録は消していません。</p>`));

    if(!rr.length){
      A.append(e("div","card","<h2>🌱 これから記録がたまります</h2><p>学習を終えると、ここに教科・単元・日付が増えていきます。</p>"));
      return;
    }

    const unitMap=new Map();
    rr.forEach(r=>unitMap.set(subject321(r)+"|"+unit321(r),r));
    const units=[...unitMap.values()];
    const days=new Set(rr.map(r=>dayKey321(r.date))).size;
    const mins=Math.round(rr.reduce((a,r)=>a+(Number(r.seconds)||0),0)/60);
    const st={確認:0,練習:0,取組:0}; units.forEach(r=>st[state321(r)]++);

    A.append(e("div","card",`<h2>全体</h2>
      <div class="p320-stats">
        <div><b>${days}</b><span>学習日</span></div>
        <div><b>${rr.length}</b><span>学習記録</span></div>
        <div><b>${units.length}</b><span>取り組んだ単元</span></div>
      </div>
      ${mins?`<p class="tiny">記録されている学習時間：約${mins}分</p>`:""}
      ${raw.length!==rr.length?`<p class="tiny">※重なっていた ${raw.length-rr.length}件は、表示上まとめています。</p>`:""}`));

    A.append(e("div","card",`<h2>今の記録</h2>
      <span class="pill">✅ 確認できた ${st.確認}</span>
      <span class="pill">🌱 練習中 ${st.練習}</span>
      <span class="pill">📝 取り組み ${st.取組}</span>
      <p class="tiny">「確認できた」は、その学習で確認できたという記録です。能力や学年全体の到達度を決める表示ではありません。</p>`));

    ["国語","算数","理科","社会","外国語活動","外国語"].forEach(sub=>{
      const u=units.filter(r=>subject321(r)===sub); if(!u.length)return;
      const ok=u.filter(r=>state321(r)==="確認").length;
      const practice=u.filter(r=>state321(r)==="練習").length;
      const doing=u.filter(r=>state321(r)==="取組").length;
      const latest=u.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      const pct=Math.round(ok/Math.max(1,u.length)*100);

      A.append(e("div","card",`<h2>${sub}</h2>
        <p><b>${u.length}単元</b>に取り組み記録があります。</p>
        <p class="tiny"><b>取り組んだ単元の中で「確認できた」割合：${pct}%</b><br>※学年全体の進度ではありません。</p>
        <div class="p320-track"><span style="width:${pct}%"></span></div>
        <p><span class="pill">✅ ${ok}</span><span class="pill">🌱 ${practice}</span><span class="pill">📝 ${doing}</span></p>
        <p class="tiny">最近：${jpDay321(latest.date)}　${unit321(latest)}</p>`));
    });

    const retry=units.filter(r=>state321(r)==="練習")
      .sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
    A.append(e("div","card",`<h2>🌱 もう一度確認するとよさそうな単元</h2>${
      retry.length?retry.map(r=>`<p><b>${subject321(r)}｜${unit321(r)}</b><br><span class="tiny">${jpDay321(r.date)}${Number(r.hints)>0?`　ヒント ${r.hints}回`:""}</span></p>`).join("")
      :"<p>現在の記録では、練習中と表示される単元はありません。</p>"
    }</div>`));

    const recent=rr.slice().reverse().slice(0,8);
    A.append(e("div","card",`<h2>🗓️ 最近の学習</h2>${
      recent.map(r=>`<p><b>${jpDay321(r.date)}　${subject321(r)}｜${unit321(r)}</b><br>
        <span class="tiny">${r.status||state321(r)}
        ${r.total?`　${r.correct!=null?`${r.correct}/${r.total}`:`${r.total}問`}`:""}
        ${r._count>1?`　同日 ${r._count}回`:""}</span></p>`).join("")
    }</div>`));

    A.append(e("p","tiny","※試作版は、この端末のブラウザ内に保存された記録を表示しています。"));
  }

  /* 旧v32.0のボタンを押した時も、整理したv32.1画面を最優先で開く */
  document.addEventListener("click",function(ev){
    const b=ev.target.closest&&ev.target.closest("button");
    if(!b)return;
    const t=(b.textContent||"").trim();
    if(t==="📊 学習の進み具合を見る" || t==="📊 生徒の学習記録・進み具合"){
      ev.preventDefault(); ev.stopImmediatePropagation(); dashboard321();
    }
  },true);
})();
</script>

<script>
/* v32.2 保護者/先生画面の進み具合ボタン重複を整理 */
(function(){
  const app322=document.getElementById("app");
  function dedupe322(){
    if(!app322)return;

    const parentBtns=[...app322.querySelectorAll("button")].filter(b=>
      (b.textContent||"").trim()==="📊 学習の進み具合を見る"
    );
    if(parentBtns.length>1){
      const keep=parentBtns.find(b=>b.classList.contains("p320-parent")) || parentBtns[0];
      parentBtns.forEach(b=>{ if(b!==keep) b.remove(); });
    }

    const teacherBtns=[...app322.querySelectorAll("button")].filter(b=>
      (b.textContent||"").trim()==="📊 生徒の学習記録・進み具合"
    );
    if(teacherBtns.length>1){
      const keep=teacherBtns.find(b=>b.classList.contains("p320-teacher")) || teacherBtns[0];
      teacherBtns.forEach(b=>{ if(b!==keep) b.remove(); });
    }
  }

  new MutationObserver(()=>dedupe322()).observe(app322,{childList:true,subtree:true});
  dedupe322();
  document.addEventListener("click",()=>setTimeout(dedupe322,0),true);
})();
</script>
